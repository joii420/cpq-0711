const DS=[["quote", "报价", "ds_quote_", "销售料号 material_no"], ["cost_basic", "基础核价", "ds_cost_basic_", "生产料号 production_no"], ["cost_detail", "明细核价", "ds_cost_detail_", "生产料号 production_no"]];
const TABS=['主件','材质元素','零件 / 外购件 / BOM树','费用类'];
let curDs='cost_basic', curTab='主件', curVar='', picked=3;

const seg=document.getElementById('dsSeg');
DS.forEach(function(d){var b=document.createElement('button');b.textContent=d[1];b.dataset.k=d[0];
  b.onclick=function(){askSwitch(d[0])};seg.appendChild(b)});

function tablesOf(ds,tab){var o=[];var t=DATA[ds];
  for(var k in t){if(t[k].tab===tab)o.push(t[k])}
  return o.sort(function(a,b){return a.tbl<b.tbl?-1:1})}
function deadOf(ds){var o=[];var t=DATA[ds];
  for(var k in t){if(t[k].tab.indexOf('不进图')===0)o.push(t[k])}return o}

function askSwitch(k){ if(k===curDs)return;
  if(picked>0){ document.getElementById('dlgTxt').innerHTML=
     '从 <b>'+label(curDs)+'</b> 切到 <b>'+label(k)+'</b>，当前已选的 <b>'+picked+'</b> 个输出列将被清空。';
     document.getElementById('dlg').setAttribute('open','');
     document.getElementById('dlgYes').onclick=function(){picked=0;doSwitch(k);close_()};
     document.getElementById('dlgNo').onclick=close_;
  } else doSwitch(k); }
function close_(){document.getElementById('dlg').removeAttribute('open')}
function label(k){for(var i=0;i<DS.length;i++)if(DS[i][0]===k)return DS[i][1];return k}
function doSwitch(k){curDs=k;curTab='主件';render()}

document.getElementById('tabSel').onchange=function(e){curTab=e.target.value;curVar='';render()};
document.getElementById('varSel').onchange=function(e){curVar=e.target.value;render()};

function render(){
  Array.prototype.forEach.call(seg.children,function(b){b.setAttribute('aria-pressed',b.dataset.k===curDs)});
  var ts=document.getElementById('tabSel');ts.innerHTML='';
  TABS.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;
    if(tablesOf(curDs,t).length===0){o.disabled=true;o.textContent=t+'（本数据集无）'}
    ts.appendChild(o)});
  ts.value=curTab;

  var fee=tablesOf(curDs,'费用类');
  var vw=document.getElementById('varWrap');
  if(curTab==='费用类'){vw.style.display='';var vs=document.getElementById('varSel');vs.innerHTML='';
    fee.forEach(function(t){var o=document.createElement('option');o.value=t.tbl;o.textContent=t.cn;vs.appendChild(o)});
    if(!curVar)curVar=fee.length?fee[0].tbl:'';vs.value=curVar;}
  else vw.style.display='none';

  var meta=DS.filter(function(d){return d[0]===curDs})[0];
  document.getElementById('axisInfo').innerHTML=
    '轴列 <b>'+meta[3]+'</b>　·　表前缀 <code>'+meta[2]+'</code>　·　本数据集共 '+Object.keys(DATA[curDs]).length+' 张主表'+
    (curDs==='quote'?'　·　⚠️ 版本切换是核价侧独有功能，报价侧不建全版本视图':'　·　✅ 带版本表指向 <code>v_&lt;主表&gt;_all</code> 全版本视图');

  var show = curTab==='费用类' ? fee.filter(function(t){return t.tbl===curVar}) : tablesOf(curDs,curTab);
  var p=document.getElementById('panel');
  if(!show.length){p.innerHTML='<div class="empty">本数据集下没有「'+curTab+'」类型的表 —— 该页签类型不可选（下拉里已置灰）。</div>';}
  else{
    p.innerHTML='<div class="grid">'+show.map(card).join('')+'</div>'+deadBlock();
  }
  cmp();
}
function card(t){
  var cols=t.cols.map(function(c){
    if(!c.built)return '<li class="no"><b>'+c.cn+'</b><code>— 主数据 JOIN 带出，只读，不建字段</code><span class="tag">NAME</span></li>';
    var tg='';
    if(c.mark.indexOf('轴')>=0)tg+='<span class="tag axis">轴</span>';
    if(c.mark.indexOf('对比项')>=0)tg+='<span class="tag cmp">对比项</span>';
    return '<li><b>'+c.cn+'</b><code>'+c.db+' · '+c.pg+'</code>'+tg+'</li>';}).join('');
  return '<div class="sheet"><h3><span>'+t.cn+'</span><code>'+t.tbl+(t.versioned?' 🕐':' 🔓')+'</code></h3><ul>'+cols+'</ul></div>';
}
function deadBlock(){
  var d=deadOf(curDs); if(!d.length)return '';
  return '<div class="warn" style="margin-top:12px"><b>本数据集有 '+d.length+' 张表不进语义图</b>（配置器里拖不到）：'+
    d.map(function(t){return '<code>'+t.tbl+'</code>（'+t.cn+'，'+(t.tab.indexOf('年降')>0?'N-18 年降，用户已裁不做':'N-19 无轴列语义')+'）'}).join('　·　')+'</div>';
}
function cmp(){
  var rows='<tr><th>页签类型</th>'+DS.map(function(d){return '<th>'+d[1]+'</th>'}).join('')+'</tr>';
  TABS.concat(['不进图']).forEach(function(t){
    rows+='<tr><td>'+t+'</td>'+DS.map(function(d){
      var n = t==='不进图' ? deadOf(d[0]).length : tablesOf(d[0],t).length;
      return '<td>'+(n?n+' 张':'<span style="color:var(--sub)">—</span>')+'</td>'}).join('')+'</tr>';});
  rows+='<tr><td><b>合计主表</b></td>'+DS.map(function(d){return '<td><b>'+Object.keys(DATA[d[0]]).length+'</b></td>'}).join('')+'</tr>';
  rows+='<tr><td>带版本表</td>'+DS.map(function(d){var n=0;var t=DATA[d[0]];for(var k in t)if(t[k].versioned)n++;
    return '<td>'+n+'</td>'}).join('')+'</tr>';
  document.getElementById('cmp3').innerHTML=rows;
}
render();
</script>
