<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>基础核价 · 抽屉（空态）</title><link rel="stylesheet" href="antd-like.css"></head><body>
<div class="page"><div class="card"><div class="card-head">主数据维护 · 基础核价</div><div class="card-body"><p class="muted">（背景页）</p></div></div></div>
<div class="mask"></div>
<div class="drawer" style="width:1180px">
  <div class="drawer-head"><div><span class="drawer-title">基础核价 · <b>2120033401</b></span>
    <span class="muted" style="margin-left:12px">外购件-弹簧</span></div><button class="close">✕</button></div>
  <div class="drawer-body"><div class="lt">
    <div class="lt-nav">
      <div class="lt-item active">物料BOM <span class="badge">—</span></div>
      <div class="lt-item">物料与元素BOM <span class="badge">—</span></div>
      <div class="lt-item">来料加工费 <span class="badge">—</span></div>
      <div class="lt-item">来料其他费用 <span class="badge">—</span></div>
      <div class="lt-item">来料其他固定费用 <span class="badge">—</span></div>
      <div class="lt-item">加工费&amp;组装费 <span class="badge">—</span></div>
      <div class="lt-item">其他外加工成本 <span class="badge">—</span></div>
      <div class="lt-item">成品其他比例费用 <span class="badge">—</span></div>
      <div class="lt-item">成品其他固定费用 <span class="badge">—</span></div>
    </div>
    <div class="lt-body">
      <div class="toolbar">
        <div class="row"><span class="muted">版本</span>
          <select class="select" style="width:190px" disabled><option>暂无版本</option></select>
          <span class="tag tag-grey">尚未创建</span></div>
        <div class="toolbar-right">
          <button class="btn">＋ 新增行</button>
          <span class="tt"><button class="btn btn-primary disabled">💾 保 存</button><span class="tip">请先新增至少一行数据</span></span>
        </div>
      </div>
      <div class="empty">
        <span class="empty-icon">🗒️</span>
        暂无数据，可点「新增行」录入或从 Excel 导入
      </div>
      <p class="muted" style="margin-top:12px">🚫 空态<b>不是</b>红色遮罩、<b>不是</b>白屏、<b>不是</b>「加载中…」永久占位（<code>AP-31 / AP-38</code> 族）。
        首次保存后该 tab 变为 <b>v1</b>，接口返回 <code>result: CREATED</code>。</p>
    </div>
  </div></div>
