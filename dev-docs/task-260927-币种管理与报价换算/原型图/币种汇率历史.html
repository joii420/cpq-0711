<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>币种汇率历史</title><link rel="stylesheet" href="antd-like.css"><style>.drawer.history{width:min(880px,calc(100vw - 220px));min-width:680px}.history-tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.history-tools .form-item{margin:0}.history-table{overflow:auto}.history-table table{min-width:760px}@media(max-width:900px){.drawer.history{min-width:0;width:100%}}</style></head><body><div class="proto-shell"><aside class="proto-sider"><div class="proto-logo">CPQ 报价系统</div><div class="proto-menu-group">系统管理</div><div class="proto-menu-item group active">⚙　系统管理</div><div class="proto-menu-item child active">币种管理</div><div class="proto-menu-item child">用户管理</div></aside><div class="proto-main"><header class="proto-header"><span class="icon">☾</span><span class="icon">♧</span><span class="proto-user">◯　管理员</span></header><main class="proto-content"><div class="card"><div class="card-head">币种管理 <span><a href="币种管理.html">返回币种列表</a></span></div><div class="card-body"><table><thead><tr><th>币种代码</th><th>币种名称</th><th>当前汇率</th><th>生效日期</th><th>状态</th></tr></thead><tbody><tr><td id="bgCode">USD</td><td id="bgName">美元</td><td id="bgRate">1 USD = 7.200000000000 CNY</td><td>2026-09-27</td><td><span class="tag blue">历史已打开</span></td></tr></tbody></table></div></div></main></div></div><div class="drawer-mask"></div><aside class="drawer history" role="dialog" aria-label="历史汇率"><div class="drawer-head"><span id="drawerTitle">USD · 历史汇率</span><button id="closeHistory" class="btn" type="button" aria-label="关闭">×</button></div><div class="drawer-body"><div class="history-tools"><div class="form-item"><label class="form-label">开始日期</label><input id="fromDate" class="form-control" type="date" value="2026-09-01"></div><div class="form-item"><label class="form-label">结束日期</label><input id="toDate" class="form-control" type="date" value="2026-09-27"></div><button id="filterHistory" class="btn" type="button">查询</button><a id="importLink" class="btn primary" href="汇率导入.html?currency=USD">导入汇率</a></div><div class="divider">汇率记录</div><div class="history-table"><table><thead><tr><th>生效日期</th><th class="right">汇率（1 <span class="currency-code">USD</span> = CNY）</th><th>来源</th><th>抓取/导入时间</th><th>状态</th></tr></thead><tbody id="historyRows"></tbody></table></div><div id="historyEmpty" class="empty" hidden>当前日期范围暂无汇率记录</div></div><div class="drawer-foot"><button id="closeHistory2" class="btn" type="button">关闭</button></div></aside><script>(function(){const qs=new URLSearchParams(location.search);const code=(qs.get('currency')||'USD').toUpperCase();const data={USD:{name:'美元',rate:'7.200000000000',rows:[['2026-09-27','7.200000000000','手工导入','2026-09-27 10:00'],['2026-09-26','7.180000000000','手工导入','2026-09-26 16:20'],['2026-09-25','7.210000000000','Excel 导入','2026-09-25 09:30']]},JPY:{name:'日元',rate:'0.048000000000',rows:[['2026-09-26','0.048000000000','手工导入','2026-09-26 11:10'],['2026-09-25','0.047800000000','Excel 导入','2026-09-25 09:30']]},CNY:{name:'人民币',rate:'1.000000000000',rows:[['2026-09-27','1.000000000000','系统','2026-09-27 00:00']]}}[code]||null;if(!data){document.getElementById('drawerTitle').textContent='币种不存在';return}document.getElementById('drawerTitle').textContent=code+' · '+data.name+'历史汇率';document.getElementById('bgCode').textContent=code;document.getElementById('bgName').textContent=data.name;document.getElementById('bgRate').textContent='1 '+code+' = '+data.rate+' CNY';document.querySelectorAll('.currency-code').forEach(x=>x.textContent=code);document.getElementById('importLink').href='汇率导入.html?currency='+code;const body=document.getElementById('historyRows');function render(){const from=document.getElementById('fromDate').value,to=document.getElementById('toDate').value;const rows=data.rows.filter(r=>(!from||r[0]>=from)&&(!to||r[0]<=to));body.innerHTML=rows.map(r=>'<tr><td>'+r[0]+'</td><td class="right">'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td><span class="tag green">有效</span></td></tr>').join('');document.getElementById('historyEmpty').hidden=rows.length>0}render();document.getElementById('filterHistory').onclick=render;function close(){location.href='币种管理.html'}document.getElementById('closeHistory').onclick=close;document.getElementById('closeHistory2').onclick=close;document.querySelector('.drawer-mask').onclick=close})();</script></body></html>
