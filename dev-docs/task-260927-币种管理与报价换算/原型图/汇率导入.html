<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇率导入</title><link rel="stylesheet" href="antd-like.css"><style>.drawer.price{width:min(840px,calc(100vw - 220px));min-width:680px}.upload-zone{border:1px dashed #91caff;border-radius:6px;background:#fafafa;text-align:center;padding:28px 16px;color:#1677ff}.upload-zone input{display:none}.upload-zone label{cursor:pointer;display:block}.preview-scroll{overflow:auto}.preview-scroll table{min-width:650px}@media(max-width:900px){.drawer.price{min-width:0;width:100%}}</style></head><body><div class="proto-shell"><aside class="proto-sider"><div class="proto-logo">CPQ 报价系统</div><div class="proto-menu-group">系统管理</div><div class="proto-menu-item group active">⚙　系统管理</div><div class="proto-menu-item child active">币种管理</div><div class="proto-menu-item child">用户管理</div></aside><div class="proto-main"><header class="proto-header"><span class="icon">☾</span><span class="icon">♧</span><span class="proto-user">◯　管理员</span></header><main class="proto-content"><div class="card"><div class="card-head">币种管理 <span><a href="币种管理.html">返回币种列表</a></span></div><div class="card-body"><table><thead><tr><th>币种代码</th><th>币种名称</th><th>当前汇率</th><th>生效日期</th><th>操作</th></tr></thead><tbody><tr><td id="bgCode">USD</td><td id="bgName">美元</td><td id="bgRate">1 USD = 7.200000000000 CNY</td><td>2026-09-27</td><td><span class="tag blue">导入汇率</span></td></tr></tbody></table></div></div></main></div></div><div class="drawer-mask"></div><aside class="drawer price" role="dialog" aria-label="导入汇率"><div class="drawer-head"><span>导入汇率</span><button id="closeImport" class="btn" type="button" aria-label="关闭">×</button></div><div class="drawer-body"><div class="form-item"><label for="targetCurrency" class="form-label required">目标币种</label><select id="targetCurrency" class="form-control"><option value="USD">USD · 美元</option><option value="JPY">JPY · 日元</option><option value="CNY">CNY · 人民币</option></select><div class="form-hint">一次导入一个目标币种，汇率方向为 1 目标币种 = N CNY</div></div><div class="toolbar"><a id="templateDownload" class="btn" download="汇率导入模板.csv" href="data:text/csv;charset=utf-8,%EF%BB%BF%E7%94%9F%E6%95%88%E6%97%A5%E6%9C%9F%2C%E6%B1%87%E7%8E%87%2C%E6%9D%A5%E6%BA%90%0A2026-09-27%2C7.200000000000%2C%E8%B4%A2%E5%8A%A1%E5%AF%BC%E5%85%A5">⇩ 下载 Excel 模板</a><span class="form-hint">模板列：生效日期*、汇率*、来源</span></div><div class="upload-zone"><label for="rateFile">⇧ 点击选择 Excel 文件<input id="rateFile" type="file" accept=".xlsx,.xls"></label><div id="fileName" class="form-hint">支持 .xlsx / .xls，单次不超过 5MB</div></div><div class="divider">导入预览 <span class="page-subtitle">原型演示数据，不写入系统</span></div><div class="preview-scroll"><table><thead><tr><th>行号</th><th>生效日期</th><th class="right">汇率</th><th>来源</th><th>校验结果</th></tr></thead><tbody id="previewRows"></tbody></table></div><div id="resultAlert" class="alert"></div></div><div class="drawer-foot"><button id="resetImport" class="btn" type="button">重置</button><button id="startImport" class="btn primary" type="button">开始导入</button></div></aside><script>(function(){const qs=new URLSearchParams(location.search);let code=(qs.get('currency')||'USD').toUpperCase();let state=qs.get('state')||'invalid';const cfg={USD:{name:'美元',rate:'7.200000000000'},JPY:{name:'日元',rate:'0.048000000000'},CNY:{name:'人民币',rate:'1.000000000000'}};if(!cfg[code])code='USD';const currency=document.getElementById('targetCurrency');currency.value=code;document.getElementById('bgCode').textContent=code;document.getElementById('bgName').textContent=cfg[code].name;document.getElementById('bgRate').textContent='1 '+code+' = '+cfg[code].rate+' CNY';const rows={invalid:[['2','2026-09-27',cfg[code].rate,'财务导入','<span class="tag green">通过</span>'],['3','2026-09-28',code==='JPY'?'0.047800000000':'7.180000000000','财务导入','<span class="tag green">通过</span>'],['4','2026-09-26','0','财务导入','<span class="tag red">失败</span>']],success:[['2','2026-09-27',cfg[code].rate,'财务导入','<span class="tag green">新增</span>'],['3','2026-09-28',code==='JPY'?'0.047800000000':'7.180000000000','财务导入','<span class="tag green">新增</span>']]};function render(){document.getElementById('previewRows').innerHTML=(rows[state]||rows.invalid).map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="right">'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td></tr>').join('');const alert=document.getElementById('resultAlert');if(state==='invalid'){alert.className='alert error';alert.textContent='第 4 行失败：汇率必须大于 0；本批次校验失败，不写入任何汇率记录。';document.getElementById('startImport').disabled=true;document.getElementById('startImport').title='修正预览错误后才能导入'}else{alert.className='alert success';alert.textContent='校验通过：2 条记录待导入。确认后整批写入历史汇率。';document.getElementById('startImport').disabled=false}}render();document.getElementById('rateFile').onchange=function(e){const f=e.target.files[0];if(f)document.getElementById('fileName').textContent='已选择：'+f.name+'（原型仅展示预览）'};currency.onchange=function(){location.href='汇率导入.html?currency='+currency.value+'&state='+state};document.getElementById('startImport').onclick=function(){if(!this.disabled){state='success';render();this.textContent='已导入';this.disabled=true}};document.getElementById('resetImport').onclick=function(){location.href='汇率导入.html?currency='+code+'&state=invalid'};function close(){location.href='币种管理.html'}document.getElementById('closeImport').onclick=close;document.querySelector('.drawer-mask').onclick=close})();</script></body></html>
